<!doctype html>
<meta charset="utf-8">
<title>Dayi Browser Source Fixture</title>
<style>
body { font: 18px system-ui; margin: 40px; max-width: 800px; }
textarea { display: block; width: 90%; height: 100px; margin: 20px 0; }
iframe { width: 95%; height: 270px; }
</style>
<h1>Browser source · synthetic drafts only</h1>
<textarea aria-label="Synthetic draft">Synthetic browser source draft.</textarea>
<button onclick="const input = document.querySelector('textarea'); input.focus(); input.select()">Select synthetic draft</button>
<button onclick="history.pushState({}, '', '?route=second#synthetic')">Change page route</button>
<script>
if (location.protocol === 'http:' && !location.search.includes('frame=1')) {
  const frame = document.createElement('iframe');
  frame.title = 'Cross-origin synthetic draft';
  const url = new URL(location.href);
  url.hostname = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  url.search = '?frame=1';
  frame.src = url.href;
  document.body.append(frame);
}
</script>
