name: macOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      POLISH_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Swift tests
        run: swift test
      - name: Build local validation bundle
        run: zsh scripts/package-app.sh
      - name: App bundle checks
        run: |
          codesign --verify --strict outputs/Dayi.app
          test -s outputs/Dayi.app/Contents/Resources/Dayi.icns
          git diff --exit-code -- Localization Sources/PolishCore/Resources/Localization
